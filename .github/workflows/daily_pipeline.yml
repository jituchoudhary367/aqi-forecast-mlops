name: Daily AQI Forecast Pipeline

on:
  schedule:
    - cron: "0 3 * * *"   # runs daily at 03:00 UTC
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill or Fetch Data
        run: |
          python src/data_fetch/backfill_data.py || true
          python src/data_fetch/fetch_data.py || true
          python src/data_fetch/build_dataset.py || true

      - name: Prepare training dataset
        run: |
          python src/training/prepare_data.py || true

      - name: Train model
        run: |
          python src/training/train_model.py || true

      - name: Generate forecast
        run: |
          python src/inference/generate_forecast.py || true

      - name: Commit results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Daily automated AQI pipeline update" || echo "No changes"
          git push
