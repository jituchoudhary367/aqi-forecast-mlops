name: Daily AQI Forecast Pipeline

on:
  schedule:
    - cron: "0 3 * * *" # runs daily at 03:00 UTC
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required for git push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify environment
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          LAT: ${{ secrets.LAT }}
          LON: ${{ secrets.LON }}
        run: |
          echo "Checking environment variables..."
          if [ -z "$OPENWEATHER_API_KEY" ]; then
            echo "Error: OPENWEATHER_API_KEY not set"
            exit 1
          fi
          if [ -z "$LAT" ] || [ -z "$LON" ]; then
            echo "Error: LAT or LON not set"
            exit 1
          fi
          echo "Environment variables configured ✓"

      - name: Fetch latest data
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          LAT: ${{ secrets.LAT }}
          LON: ${{ secrets.LON }}
        run: |
          echo "Fetching weather and pollution data..."
          python src/data_fetch/fetch_data.py

      - name: Build dataset
        run: |
          echo "Building consolidated dataset..."
          python src/data_fetch/build_dataset.py

      - name: Prepare training dataset
        run: |
          echo "Preparing training dataset with temporal features..."
          python src/training/prepare_data.py

      - name: Train model
        run: |
          echo "Training AQI prediction model..."
          python src/training/train_model.py

      - name: Generate forecast
        run: |
          echo "Generating next-day AQI forecast..."
          python src/inference/generate_forecast.py

      - name: Verify forecast
        run: |
          echo "Verifying forecast was generated..."
          TODAY=$(date -u +%Y-%m-%d)
          FORECAST_FILE="forecasts/forecast_${TODAY}.json"
          if [ ! -f "$FORECAST_FILE" ]; then
            echo "Error: Forecast file not found: $FORECAST_FILE"
            exit 1
          fi
          echo "Forecast file found ✓"
          cat "$FORECAST_FILE"

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/*.csv data/processed/*.csv forecasts/*.json models/*.pkl || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily automated AQI pipeline update [$(date -u +%Y-%m-%d)]"
            git push
            echo "Changes committed and pushed ✓"
          fi

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Pushing to Hugging Face Space..."
          git push https://huggllm:$HF_TOKEN@huggingface.co/spaces/huggllm/aqi-forecast-mlops main:main --force
          echo "Deployed to Hugging Face successfully 🚀"
